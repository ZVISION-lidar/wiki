site_name: ZVISION的Wiki文档
site_description: 技术文档知识库
site_author: Administrator

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

nav:
  - NZ系列:
      - 产品总览: zvision_nz_series/NZ系列/产品总览.md
      - 用户手册: zvision_nz_series/NZ系列/用户手册.md
      - 阅读提示: zvision_nz_series/NZ系列/阅读提示.md
      - 安装指南: zvision_nz_series/NZ系列/安装指南.md
      - 产品详细说明:
          - NZ1:
              - 硬件说明: zvision_nz_series/NZ系列/NZ1/硬件说明.md
              - 电源与连接: zvision_nz_series/NZ系列/NZ1/电源与连接.md
              - 数据协议: zvision_nz_series/NZ系列/NZ1/数据协议.md
          - NZ3:
              - 硬件说明: zvision_nz_series/NZ系列/NZ3/硬件说明.md
              - 电源与连接: zvision_nz_series/NZ系列/NZ3/电源与连接.md
              - 数据协议: zvision_nz_series/NZ系列/NZ3/数据协议.md
          - NZ5:
              - 硬件说明: zvision_nz_series/NZ系列/NZ5/硬件说明.md
              - 电源与连接: zvision_nz_series/NZ系列/NZ5/电源与连接.md
              - 数据协议: zvision_nz_series/NZ系列/NZ5/数据协议.md
  - 产品通用教程:
      - 快速启动:
          - 方法说明: zvision_nz_series/产品通用教程/快速启动/方法说明.md
          - 常见故障排查: zvision_nz_series/产品通用教程/快速启动/常见故障排查.md
      - 网络配置: zvision_nz_series/产品通用教程/网络配置.md
      - ROS Driver & SDK:
          - 资源下载: zvision_nz_series/产品通用教程/ROS-Driver-SDK/资源下载.md
          - 使用说明: zvision_nz_series/产品通用教程/ROS-Driver-SDK/使用说明.md
          - 常见问题排查: zvision_nz_series/产品通用教程/ROS-Driver-SDK/常见问题排查.md
      - 时间同步:
          - 使用说明: zvision_nz_series/产品通用教程/时间同步/使用说明.md
          - 常见问题排查: zvision_nz_series/产品通用教程/时间同步/常见问题排查.md
      - IMU使用: zvision_nz_series/产品通用教程/IMU使用.md
      - 常用工具:
          - wireshark: zvision_nz_series/产品通用教程/常用工具/wireshark.md
          - 上位机: zvision_nz_series/产品通用教程/常用工具/上位机.md
          - GUI: zvision_nz_series/产品通用教程/常用工具/GUI.md
      - 固件升级: zvision_nz_series/产品通用教程/固件升级.md
  - 开源算法:
      - SLAM 概览:
          - FASTLIO2使用说明: zvision_nz_series/开源算法/SLAM概览/FASTLIO2使用说明.md
          - SuperLIO2使用说明: zvision_nz_series/开源算法/SLAM概览/SuperLIO2使用说明.md
  - 关注我们: zvision_nz_series/关注我们.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
