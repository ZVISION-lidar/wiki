site_name: ZVISION的Wiki文档
site_description: 技术文档知识库
site_author: Administrator

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

nav:
  - NZ系列:
      - 产品总览: zvision_nz_series/NZ_Series/Product_Overview.md
      - 用户手册: zvision_nz_series/NZ_Series/User_Manual.md
      - 阅读提示: zvision_nz_series/NZ_Series/Reading_Tips.md
      - 安装指南: zvision_nz_series/NZ_Series/Installation_Guide.md
      - 产品详细说明:
          - NZ1:
              - 硬件说明: zvision_nz_series/NZ_Series/NZ1/Hardware_Description.md
              - 电源与连接: zvision_nz_series/NZ_Series/NZ1/Power_and_Connection.md
              - 数据协议: zvision_nz_series/NZ_Series/NZ1/Data_Protocol.md
          - NZ3:
              - 硬件说明: zvision_nz_series/NZ_Series/NZ3/Hardware_Description.md
              - 电源与连接: zvision_nz_series/NZ_Series/NZ3/Power_and_Connection.md
              - 数据协议: zvision_nz_series/NZ_Series/NZ3/Data_Protocol.md
          - NZ5:
              - 硬件说明: zvision_nz_series/NZ_Series/NZ5/Hardware_Description.md
              - 电源与连接: zvision_nz_series/NZ_Series/NZ5/Power_and_Connection.md
              - 数据协议: zvision_nz_series/NZ_Series/NZ5/Data_Protocol.md
  - 产品通用教程:
      - 快速启动:
          - 方法说明: zvision_nz_series/General_Product_Tutorial/Quick_Start/Instructions.md
          - 常见故障排查: zvision_nz_series/General_Product_Tutorial/Quick_Start/Common_Issue_Checks.md
      - 网络配置: zvision_nz_series/General_Product_Tutorial/Network_Configuration.md
      - ROS Driver & SDK:
          - 资源下载: zvision_nz_series/General_Product_Tutorial/ROS-Driver-SDK/Resource_Download.md
          - 使用说明: zvision_nz_series/General_Product_Tutorial/ROS-Driver-SDK/Instructions.md
          - 常见问题排查: zvision_nz_series/General_Product_Tutorial/ROS-Driver-SDK/Common_Issue_Checks.md
      - 时间同步:
          - 使用说明: zvision_nz_series/General_Product_Tutorial/Time_Sync/Instructions.md
          - 常见问题排查: zvision_nz_series/General_Product_Tutorial/Time_Sync/Common_Issue_Checks.md
      - IMU使用: zvision_nz_series/General_Product_Tutorial/Using_IMU.md
      - 常用工具:
          - wireshark: zvision_nz_series/General_Product_Tutorial/Common_Tools/wireshark.md
          - 上位机: zvision_nz_series/General_Product_Tutorial/Common_Tools/Host_computer.md
          - GUI: zvision_nz_series/General_Product_Tutorial/Common_Tools/GUI.md
      - 固件升级: zvision_nz_series/General_Product_Tutorial/Firmware_update.md
  - 开源算法:
      - SLAM 概览:
          - FASTLIO2使用说明: zvision_nz_series/Open-source_algorithm/Overview_of_SLAM/FASTLIO2.md
          - SuperLIO2使用说明: zvision_nz_series/Open-source_algorithm/Overview_of_SLAM/SuperLIO2.md
  - 关注我们: zvision_nz_series/Follow_us.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
