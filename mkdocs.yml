site_name: ZVISION的Wiki文档
site_description: 技术文档知识库
site_author: Administrator

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.tabs
    # - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

# extra_javascript:
#   - javascripts/sidebar-collapse.js

nav:
  - 首页: index.md
  - 快速上手:
      - 概览: quickstart/index.md
      - 快速开始demo:
          - quickstart/demo.md
          - demo1: quickstart/demo/demo1.md
          - demo2: quickstart/demo/demo2.md
      - 快速开始SLAM: quickstart/slam.md
  - 配置说明: config.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
