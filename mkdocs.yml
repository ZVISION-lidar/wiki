site_name: 我的Wiki文档
site_description: 技术文档知识库
site_author: Administrator

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 快速上手:
      - 快速开始demo: quickstart.md
      - 快速开始SLAM: quickstart/slam.md
  - 配置说明: config.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
